server:
  port: 8083

spring:
  application:
    name: judge-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${JUDGE_DB_URL:jdbc:postgresql://localhost:5432/d3_judge}
    username: ${JUDGE_DB_USER:d3_judge}
    password: ${JUDGE_DB_PASSWORD:${D3_SERVICE_DB_PASSWORD:local-only}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${D3_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  kafka:
    bootstrap-servers: ${D3_KAFKA_HOST:localhost}:${D3_KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

d3:
  security:
    jwk-set-uri: ${D3_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${D3_JWT_ISSUER:http://localhost:8081}
    audience: ${D3_JWT_JUDGE_AUDIENCE:judge-service}
    allowed-client-id: ${D3_JWT_JUDGE_CLIENT_ID:battle-service}
    allowed-token-use: ${D3_JWT_SERVICE_TOKEN_USE:service}
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
    allowed-origin: ${JUDGE0_ALLOWED_ORIGIN:http://localhost:2358}
    authentication-header: ${JUDGE0_AUTH_HEADER:X-Auth-Token}
    authentication-token: ${JUDGE0_AUTH_TOKEN:}
    connect-timeout: 2s
    request-timeout: 10s
    poll-interval: 100ms
    poll-timeout: 30s
  judge:
    adapter: ${D3_JUDGE_ADAPTER:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
