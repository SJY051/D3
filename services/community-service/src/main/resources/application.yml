server:
  port: 8084

spring:
  application:
    name: community-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://localhost:5432/d3_community}
    username: ${COMMUNITY_DB_USER:d3_community}
    password: ${COMMUNITY_DB_PASSWORD:${D3_SERVICE_DB_PASSWORD:local-only}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${D3_KAFKA_HOST:localhost}:${D3_KAFKA_PORT:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
