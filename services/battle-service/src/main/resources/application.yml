server:
  port: 8082

spring:
  application:
    name: battle-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${BATTLE_DB_URL:jdbc:postgresql://localhost:5432/d3_battle}
    username: ${BATTLE_DB_USER:d3_battle}
    password: ${BATTLE_DB_PASSWORD:${D3_SERVICE_DB_PASSWORD:local-only}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${D3_REDIS_HOST:localhost}
      port: ${D3_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${D3_KAFKA_HOST:localhost}:${D3_KAFKA_PORT:9092}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${D3_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

d3:
  web-origin: ${D3_WEB_ORIGIN:http://localhost:5173}
  security:
    jwk-set-uri: ${D3_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${D3_JWT_ISSUER:http://localhost:8081}
    audience: ${D3_JWT_USER_AUDIENCE:d3-user}
  battle:
    match-duration: ${D3_BATTLE_MATCH_DURATION:10m}
    ranked-matchmaking:
      initial-rating: ${D3_RANKED_INITIAL_RATING:1500}
      initial-window: ${D3_RANKED_INITIAL_WINDOW:100}
      widening-step: ${D3_RANKED_WIDENING_STEP:50}
      widening-interval: ${D3_RANKED_WIDENING_INTERVAL:10s}
      maximum-window: ${D3_RANKED_MAXIMUM_WINDOW:300}
      entry-ttl: ${D3_RANKED_ENTRY_TTL:2m}
      lease-ttl: ${D3_RANKED_LEASE_TTL:5s}
