d3:
  runtime:
    config-version: local-v1

spring:
  kafka:
    bootstrap-servers: ${D3_KAFKA_HOST:localhost}:${D3_KAFKA_PORT:9092}
  data:
    redis:
      host: ${D3_REDIS_HOST:localhost}
      port: ${D3_REDIS_PORT:6379}

eureka:
  instance:
    hostname: ${D3_EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
    ip-address: ${D3_EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
