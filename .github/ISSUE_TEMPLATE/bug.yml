name: Bug
description: 재현 가능한 결함과 기대 동작을 기록합니다.
title: "fix: "
body:
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      placeholder: D3-...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: 환경, 입력, 단계, 실제 결과를 포함해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Regression evidence
      description: 수정 전 실패하고 수정 후 통과할 가장 작은 검증을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and data/security considerations
    validations:
      required: true
